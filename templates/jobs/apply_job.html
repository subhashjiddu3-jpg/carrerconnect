
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Job | CareerConnect</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #26344a;
        }

        header {
            background: #173b70;
            color: white;
            padding: 20px 7%;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        h1 {
            color: #173b70;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #173b70;
            color: white;
            padding: 13px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #24569a;
        }

        a {
            color: #173b70;
        }
    </style>
</head>

<body>

<header>
    <h2>CareerConnect</h2>
</header>

<div class="container">

    <h1>Apply for Job</h1>

    <h3>{{ job.title }}</h3>
    <p>Company: {{ job.company_name }}</p>
    <p>Location: {{ job.location }}</p>

    <hr>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Submit Application</button>

    </form>

    <p>
        <a href="{% url 'job_list' %}">Back to Available Jobs</a>
    </p>

</div>

</body>
</html>
