
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Job - CareerConnect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            padding: 30px;
        }
        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }
        h1 { color: #dc3545; }
        button {
            background: #dc3545;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        a {
            margin-left: 15px;
            color: #2457c5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Delete Job</h1>

        <p>Are you sure you want to delete this job?</p>

        <h3>{{ job.title }}</h3>

        <form method="POST">
            {% csrf_token %}
            <button type="submit">Yes, Delete Job</button>
            <a href="{% url 'company_dashboard' %}">Cancel</a>
        </form>
    </div>
</body>
</html>
